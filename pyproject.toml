[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windtunnel-shear"
version = "0.1.1"
description = "Wind shear for LLM APIs — intercept, mutate, record, replay, and stress-test any LLM conversation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["llm", "testing", "proxy", "ai", "openai", "fault-injection", "wind-tunnel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "typer>=0.12",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
fast = ["orjson>=3.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "python-dotenv>=1.0",
]

[project.scripts]
shear = "windtunnel_shear.cli.main:app"

[project.urls]
Homepage = "https://github.com/MothLabs-org/windtunnel-shear"
Repository = "https://github.com/MothLabs-org/windtunnel-shear"
Issues = "https://github.com/MothLabs-org/windtunnel-shear/issues"
Changelog = "https://github.com/MothLabs-org/windtunnel-shear/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/windtunnel_shear"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["B008"]  # Typer uses function calls in argument defaults by design

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["windtunnel_shear"]

[tool.coverage.report]
fail_under = 90
